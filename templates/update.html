<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</head>
<body>
    {% include 'nav.html' %}
    <h3>Profile_Update Form</h3>
    
    <center>
    <form action="/profilesave" method="POST">
       <input type="hidden" value="{{data[0]}}" name="id">
        <input type="text" placeholder="Enter Your Name: " name="name" value="{{data[1]}}">
        <br><br>
        <input type="email" placeholder="Enter Your Email: " name="email" value="{{data[2]}}">
        <br><br>
        <input type="password" placeholder="Enter Your password" name="password" value="{{data[3]}}">
        <br><br>
        <input type="text" placeholder="Enter Your Contact: " name="contact" value="{{data[4]}}">
        <br><br>
        <button class="btn btn-warning">update</button>
    </form>
</center>
</body>
</html>
